services:
  expo:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0 npx expo start --host lan"
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      CHOKIDAR_USEPOLLING: "1"
    stdin_open: true
    tty: true
